name: Publish Development Build
on: push

permissions:
  # Needed to create a release for every build
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mc: [ "1.21.10", "1.21.11" ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Build with Gradle
        run: ./gradlew build -Pmc=${{ matrix.mc }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nether-seedcracker-mc${{ matrix.mc }}
          path: build/libs/

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: libs
          merge-multiple: true

      - name: Read Version
        id: version
        run: echo "version=$(grep '^mod-version' gradle/libs.versions.toml | cut -d'"' -f2)+build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Nether Seed Cracker ${{ steps.version.outputs.version }}
          make_latest: true
          files: |
            ./libs/*.jar
